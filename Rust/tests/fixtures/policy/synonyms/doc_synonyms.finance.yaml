# ------------------------------------------------------------------
# 업무분류 유의어 사전 — ② 업종 겹(finance · 금융)
#  · 얹는 법: doc_rule.yaml 맨 위에 `industry: finance` 를 적으면 이 파일이 얹힌다.
#  · 겹 순서: core → 이 파일 → doc_synonyms.local.yaml
#             아래로 갈수록 세다. 회사 고유의 말은 이 파일이 아니라 local 에 적는다.
#
#  [무엇이 들어 있나]
#    은행·증권·보험·카드·캐피탈에서 오가는 문서 이름이다. 크게 넷으로 묶었다.
#      · 여신·수신  — 여신심사서·대출약정서·잔액증명서 …
#      · 투자·증권  — 투자설명서·집합투자규약·운용보고서 …
#      · 보험       — 보험청약서·보험금청구서·손해사정서 …
#      · 감독·내부통제 — 준법감시보고서·자금세탁방지보고서 …
#    "계약서"·"보고서"·"규정" 같은 사무 문서와 "신고서"·"허가증" 같은 행정 문서는
#    core 가 이미 잡으므로 여기 없다.
#
#  [주의 — 금융은 넓은 말이 특히 위험하다]
#    '증권'·'채권'·'신용'·'거래' 는 본문에 널려 있는 말이다("증권시장", "채권자",
#    "신용카드"). 전부 filename_only 로 내리고 흔한 오해는 excludes 로 막았다.
# ------------------------------------------------------------------
