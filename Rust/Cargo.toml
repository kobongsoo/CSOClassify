[package]
name = "csoclassify-rs"
version = "0.1.0"
edition = "2021"
description = "CSOClassify rule-only 분류 코어의 Rust 포팅 (추출 + 규칙 분류). 정적 단일 바이너리 지향."

[[bin]]
name = "csoclassify-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# HWP5 섹션은 zlib 헤더 없는 raw deflate — zip 이 이미 끌어오는 crate 라 새 의존이 아니다.
flate2 = "1"
walkdir = "2"
encoding_rs = "0.8"
sha2 = "0.10"
once_cell = "1"
pdfium-render = "0.8"
# 임베딩(전파/--vector-only)용 — 모델·런타임은 외부 파일 로딩(pdfium 방식).
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
