# ------------------------------------------------------------------
# 업무분류 유의어 사전 — ② 업종 겹(manufacturing · 제조)
#  · 얹는 법: doc_rule.yaml 맨 위에 `industry: manufacturing` 을 적으면 얹힌다.
#             (제조 + 건설처럼 겹치면 `industry: [manufacturing, public]` 처럼 쓴다)
#  · 겹 순서: core → 이 파일 → doc_synonyms.local.yaml
#             아래로 갈수록 세다. 공장마다 다른 말은 이 파일이 아니라 local 에 적는다.
#
#  [무엇이 들어 있나]
#    공장에서 오가는 문서 이름이다. 크게 넷으로 묶었다.
#      · 생산     — 작업지시서·생산일보·작업표준서·공정도 …
#      · 품질     — 품질검사성적서·부적합보고서·시정조치보고서·교정성적서 …
#      · 자재·물류 — 자재수불부·자재명세서(BOM)·포장명세서 …
#      · 설비·안전환경 — 설비점검표·예방보전계획서·물질안전보건자료 …
#    "검수확인서"·"발주서"·"구매요청서"·"거래명세서"·"표준절차서"·"점검표" 와
#    꼬리말 "시방서"·"사양서"·"규격서"·"성적서" 는 core 가 이미 잡으므로 여기 없다.
#
#  [주의 — 제조는 영문 약어가 그대로 파일 이름에 쓰인다]
#    COA·NCR·CAPA·BOM·PTW·MSDS·SOP·FAI 처럼 현장에서 약어를 그대로 쓴다.
#    본문에서는 다른 뜻이 될 수 있으므로 대부분 filename_only 로 내렸다.
# ------------------------------------------------------------------
version: 2026.08.1
