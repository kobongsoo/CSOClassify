# ------------------------------------------------------------------
# 업무분류 유의어 사전 — ② 업종 겹(medical · 의료/보건)
#  · 얹는 법: doc_rule.yaml 맨 위에 `industry: medical` 을 적으면 이 파일이 얹힌다.
#             (여러 업종에 걸치면 `industry: [medical, public]` 처럼 적는다)
#  · 겹 순서: core → 이 파일 → doc_synonyms.local.yaml
#             아래로 갈수록 세다. 병원마다 다른 말은 이 파일이 아니라 local 에 적는다.
#
#  [무엇이 들어 있나]
#    의료·보건 분야에만 있는 문서 이름만 있다. "보고서"·"계획서"·"계약서" 같은
#    사무 문서와 "신고서"·"허가증"·"자격증" 같은 행정 문서는 core 가 이미 잡으므로
#    여기 없다. 여기 있는 것은 크게 셋이다.
#      · 임상 기록 — 진료기록부·수술기록지·판독소견서 …
#      · 보험·급여 — 요양급여비용청구서·진료비계산서 …
#      · 의료기관 행정 — 개설허가증·감염병신고서 …
#
#  [주의 — 이 업종은 excludes 가 유난히 중요하다]
#    의료 문서 이름은 본문 문장에 그대로 등장하는 일이 많다("처방전을 발급",
#    "소견서를 첨부", "진단서 사본"). 그래서 넓은 말은 filename_only 로 내리고
#    흔한 문장은 excludes 로 막아 두었다.
# ------------------------------------------------------------------
version: 2026.08.2
layer: medical

