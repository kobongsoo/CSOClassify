# ------------------------------------------------------------------
# 업무분류 유의어 사전 — ② 업종 겹(legal · 법무/법률)
#  · 얹는 법: doc_rule.yaml 맨 위에 `industry: legal` 을 적으면 이 파일이 얹힌다.
#  · 겹 순서: core → 이 파일 → doc_synonyms.local.yaml
#             아래로 갈수록 세다. 회사 고유의 말은 이 파일이 아니라 local 에 적는다.
#
#  [무엇이 들어 있나]
#    법무법인과 기업 법무팀에서 오가는 문서 이름이다. 크게 넷으로 묶었다.
#      · 소송서면 — 소장·준비서면·답변서·항소장 …
#      · 재판결과 — 판결문·결정문·조정조서 …
#      · 자문·검토 — 법률의견서·계약검토서 …
#      · 회사법무 — 정관·이사회의사록·등기신청서 …
#    "계약서"·"합의서"·"위임장" 은 core 가 이미 잡으므로 여기 없다.
#
#  [주의 — '소장' 은 이 사전에서 가장 위험한 말이다]
#    같은 두 글자가 訴狀(소송 서면)과 所長(직책)으로 쓰인다. "연구소장 지시사항"
#    같은 문서가 통째로 소송 서류로 분류되는 사고가 나므로 excludes 를 길게 두었다.
# ------------------------------------------------------------------
version: 2026.08.1
layer: legal

# ------------------------------------------------------------------
# 꼬리말 그물 — 법률 문서에만 있는 끝말
# ------------------------------------------------------------------
tails:
  # '소장' 은 訴狀(소송 서면)과 所長(직책)이 같은 글자다. 꼬리말로 쓰면
  # "손해배상청구소장" 을 잡아 주지만, 아래 excludes 의 '소장님'·'연구소장'
  # 이 함께 있어야 안전하다. 둘은 한 짝이므로 따로 지우지 않는다.
  소장:
  - 소장부본
  - 소송서면
  경고장:
  - 내용증명
  - 통고서
  - 경고서한
  준비서면:
  - 변론준비서면
  - 서면
  - 답변서
  진술서:
  - 진술조서
  - 사실확인서
  - 확인서
  답변서:
  - 반박서면
  - 답변서면
  - 답변
  통고서:
  - 최고서
  - 내용증명
  - 독촉장
  최고서:
  - 독촉장
  - 통고서
  - 최고
  독촉장:
  - 최고서
  - 촉구서
  - 독촉
  확약서:
  - 각서
  - 서약서
  - 확약
  판결문:
  - 판결정본
  - 판결등본
  - 선고문
  결정문:
