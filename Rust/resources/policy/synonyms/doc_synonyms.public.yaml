# ------------------------------------------------------------------
# 업무분류 유의어 사전 — ② 업종 겹(public · 공공기관/행정)
#  · 얹는 법: doc_rule.yaml 맨 위에 `industry: public` 을 적으면 이 파일이 얹힌다.
#             (병원·학교도 공공이면 `industry: [medical, public]` 처럼 겹쳐 쓴다)
#  · 겹 순서: core → 이 파일 → doc_synonyms.local.yaml
#             아래로 갈수록 세다. 기관 고유의 말은 이 파일이 아니라 local 에 적는다.
#
#  [무엇이 들어 있나]
#    중앙부처·지자체·공공기관에서 오가는 문서 이름이다. 크게 다섯으로 묶었다.
#      · 공문서 유통 — 시행문·협조전·접수대장 …
#      · 기록관리   — 기록물등록대장·기록관리기준표 …
#      · 자치법규·행정규칙 — 조례안·훈령·고시문 …
#      · 심의·감사  — 의결서·심의결과보고서·감사결과보고서 …
#      · 계약·성과  — 과업지시서·준공검사조서·성과계획서 …
#    "공문"·"기안서"·"품의서"·"보고서" 는 core 가 이미 잡으므로 여기 없다.
#
#  [주의] 공공기관 문서는 본문에 근거 조문과 관용구가 잔뜩 들어간다
#  ("○○조례에 따라", "훈령 제○호"). 그래서 excludes 를 넉넉히 두었다.
# ------------------------------------------------------------------
