# ------------------------------------------------------------------
# 업무분류 판단 기준(doc_rule.yaml)의 '머리 부분' 본보기
#  · 쓰는 곳: doc_rule.yaml 을 새로 만들 때(화면의 '분류 불러오기', CLI 의
#    --scaffold-doc-rule), 그리고 기존 파일에 이 섹션이 빠져 있을 때
#  · doctype_rules(분류별 규칙)는 여기에 적지 않는다 — 그건 회사 분류 체계에서
#    자동으로 만들어진다. 이 파일은 '규칙을 어떻게 점수 매길지'만 정한다.
#
#  [왜 따로 두나] doc_rule.yaml 은 화면에서 저장할 때마다 통째로 다시 쓰여
#  주석이 남지 않는다. 값의 뜻과 그 값을 고른 이유는 이 파일에 적어 두고,
#  doc_rule.yaml 에는 값만 들어가게 한다.
# ------------------------------------------------------------------
version: doctype-2026.08.ui.4
# 이 회사에 얹을 업종 사전 — doc_synonyms.<업종>.yaml 을 고른다.
# 앞에 적은 업종이 더 세다(같은 분류 이름이 두 사전에 있으면 앞엣것 말이 먼저 온다).
# 좁은 업종을 앞에, 넓은 업종을 뒤에 두었다 — public(행정 문서)은 어느 조직에나
# 있어서 가장 넓으므로 맨 뒤다.
industry: [medical, legal, finance, construction, manufacturing, education, public]
conflict: all
defaults:
  scoring: staged
  head_chars: 400
  # 본문(body) 신호를 인정할 최소 조건 — "서로 다른 말 몇 종류가(min_distinct),
  # 모두 몇 회(min_count) 나와야 본문에서 걸린 것으로 볼지".
  #
  # [왜 1/1 인가 — 실측] d:\sample 18건으로 1/1 · 1/2 · 2/1 · 2/2 를 모두 돌려
  # 봤다(2026-08-26). 네 경우 모두 **붙는 라벨이 완전히 같았다**(라벨 23개 /
  # 문서 17건). 달라진 것은 신뢰도 소수점뿐이다(예: 0.91 → 0.89).
  # 까닭은 staged 모드의 구조에 있다 — 본문은 단독으로 후보를 만들지 못하고
  # (재설계 8-4) 신뢰도도 0.15 로 낮아, 라벨을 정하는 것은 제목·파일명이다.
  # 본문 문턱을 올려도 막을 오탐이 없으므로, 값만 복잡해지는 2 대신 1 로 둔다.
  #
  # [언제 올리나] '규정'·'보고'처럼 어느 문서에나 나오는 말을 규칙에 넣었다면
  # 그 규칙에만 min_count: 2 를 직접 적는 편이 낫다(규칙 한 줄에 같은 키를 쓰면
  # 그 분류에만 적용된다). 전체 기본값을 올리면 멀쩡한 근거까지 함께 깎인다.
  # 코퍼스가 수백 건으로 늘면 같은 실험을 다시 해 볼 것.
  min_distinct: 1
  min_count: 1
  # ── 후보 채택 문턱 ────────────────────────────────────────────────
  # t_low: 근거들을 noisy-OR 로 합친 최종 점수가 이 값 미만이면 후보에서 뺀다.
  #   지금 실제로 후보를 가르는 유일한 문턱이다(doctype.rs·doctype.py).
  #   0.30 → 0.35 로 올린 이유: 0.30 은 '파일 이름' 하나만 걸린 후보(기여 0.30)가
  #   딱 문턱값이라 그대로 살아남는 자리다. 파일 이름만으로 붙은 라벨은 오탐이
  #   잦아 사람 손이 더 간다. 0.35 로 두면 그런 후보는 떨어지고, 파일 이름에
  #   제목·앞부분 중 하나라도 겹치는 후보만 남는다.
  t_low: 0.35
  # t_high: '확정 후보'로 볼 만한 선. 지금 판정에는 쓰이지 않는다 — 후보를
  #   가르는 문턱은 t_low 하나뿐이고(doctype.py·doctype.rs), t_high 는
  #   t_low ≤ t_high ≤ t_seed 라는 순서 검증(T20)에만 등장한다.
  #   [그래도 적어 두는 이유] 빠져 있으면 엔진 기본값 0.70 이 조용히 쓰이는데,
  #   t_low 를 0.70 위로 올리는 순간 아무 예고 없이 T20 에 걸려 규칙 파일이
  #   통째로 안 읽힌다. 눈에 보이는 자리에 있어야 함께 옮길 수 있다.
  t_high: 0.70
  # t_seed: 자동 씨앗 선별에서 "이 정도 확신이면 기준 문서 후보로 삼는다"는 선.
  #   기준 문서는 다음 분류의 잣대가 되므로 후보 채택선(t_low)보다 훨씬 높다 —
  #   여기서 헐거우면 잘못 붙은 라벨이 씨앗이 되어 오류가 스스로 번식한다.
  t_seed: 0.85
  # embed_cap: 규칙에 걸린 말은 없고 '비슷한 문서'(벡터)만 보고 붙은 후보의
  #   신뢰도 상한. 벡터는 "무엇이 닮았는지"를 사람에게 설명하지 못하므로,
  #   아무리 닮아도 규칙 근거가 있는 후보보다 확신이 높아지지 않게 눌러 둔다.
  embed_cap: 0.65
# 새 규칙을 만들 때 함께 넣어 줄 값 — 화면의 '분류 불러오기'와 CLI 의
# --scaffold-doc-rule 이 규칙 한 줄을 만들 때 이 값들을 그대로 얹는다.
# (엔진은 이 섹션을 읽지 않는다. 규칙 안에 적힌 weight 만 본다.)
# [신호별 신뢰도] 위 설명의 괄호 안 숫자를 여기서 바꿀 수 있다.
#  · 적은 칸만 덮어쓰고 나머지는 프로그램 기본값을 쓴다 — title 만 올려 보려면
#    title 한 줄만 남기면 된다.
#  · 값은 0.0~1.0. 모르는 신호 이름(오타)이나 범위 밖 값은 검증에서 막는다
#    (--check-rules · 화면 저장). 조용히 무시하지 않는다.
#  · scoring: staged 에서만 쓰인다. legacy 채점은 종전 상수를 그대로 쓴다.
#  · name 은 규칙의 weight 를 보지 않고 medium 값만 쓴다 — 세 칸을 반드시
#    같은 값으로 적어야 한다(다르면 검증에서 막는다).
#  · 값을 바꾸면 판정이 바뀐다. 위 version 도 함께 올려, 나중에 결과만 보고도
#    "어느 기준으로 매긴 값인지" 되짚을 수 있게 한다.
#  · 신호는 이 넷이 전부다. form·path·structure 는 규칙이 그 필드를 한 번도
#    안 채워 실제로 돌지 않았고, 2026-09-07 에 코드에서 걷어냈다.
signals:
  title: {high: 0.80, medium: 0.65, low: 0.50}
  head:  {high: 0.70, medium: 0.55, low: 0.40}
  body:  {high: 0.25, medium: 0.15, low: 0.10}
  name:  {high: 0.30, medium: 0.30, low: 0.30}

new_rule:
  # weight 는 그 규칙의 '모든 신호'가 쓸 신뢰도 열을 고른다.
  #   high   : 제목 0.80 · 앞부분 0.70 · 본문 0.25 …  (확실한 분류에)
  #   medium : 제목 0.65 · 앞부분 0.55 · 본문 0.15 …  (기본)
  #   low    : 제목 0.50 · 앞부분 0.40 · 본문 0.10 …  (넓고 흔한 분류에)
  # 엔진 기본값도 medium 이지만, 파일에 적어 두면 관리자가 "이 값을 올릴 수도
  # 있다"는 것을 알게 된다 — 안 보이는 기본값은 아무도 조정하지 않는다.
  weight: medium

embed:
  # 업무분류 2단계 — seed 벡터 비교(재설계 9장). 파일명·제목에 단서가 없는
  # 문서는 규칙으로 원리적으로 못 잡는다. 그 몫을 이 단계가 맡는다.
  enabled: true
  # 아래 값은 검증셋 150건 실측으로 고른 것이다(2026-08-26).
  #   k=5        씨앗이 33건뿐이라 투표인단을 10 으로 잡으면 seed 의 30% 가
  #              투표하게 되어, 이웃이 아닌 문서까지 표를 던진다.
  #   min_sim    0.55 → 0.70. 이 한 값이 정밀도를 가장 크게 좌우했다.
  #              0.55 에서는 안 닮은 이웃까지 믿어 오라벨이 4 → 8 로 늘었다.
  #   min_share  0.40. 득표율 문턱.
  # 씨앗이 수백 건으로 늘면 k 를 다시 올리고 재측정할 것(설계서 16장).
  k: 5
  dup_threshold: 0.95
  min_sim: 0.70
  min_share: 0.40
