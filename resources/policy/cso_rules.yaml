  - 산전과
  - 발전과
  - 충전과
  - 운전과
  - 도전과
  - 실전과
  - 전과목

- id: race
  name: 인종·민족
  category: 인종
  grade: C
  weight: medium
  seed_eligible: false
  terms:
  - 인종
  - 출신민족

# ────────────────────────────────────────────────────────────────────────
# Signal E · 보안분류 스탬프 (문서에 찍힌 '작성자의 명시적 분류 의도')
#   - 키워드(L2)와의 결정적 차이: 본문 '단발 언급'("대외비가 아님")의 오탐을 막으려,
#     표식이 문서 '머리(앞 head_chars 자)'에 있거나 'repeat_min 회 이상 반복'
#     (페이지마다 찍히는 워터마크 정황)일 때만 스탬프로 인정한다.
#       · head_chars / repeat_min 은 코드 기본값(400자 / 2회)이며 환경변수로 조정 가능:
#         CSOCLASSIFY_STAMP_HEAD_CHARS, CSOCLASSIFY_STAMP_REPEAT_MIN
#   - always: true 문구는 위치/반복 게이트 없이 1건이라도 인정(거의 스탬프 전용 표현).
#   - 스탬프는 오탐이 매우 낮아 신뢰도가 높고(confidence.stamp), 전파(Signal B) seed 로도
#     쓸 수 있다(seed_eligible). 최종 등급은 다른 신호와 max 융합되어 '상향 전용' 기여.
#   ※ 표식 문구는 정책 키워드(원문 PII 아님)라 결과 근거(term)에 남겨도 안전하다.
# ────────────────────────────────────────────────────────────────────────
stamps:

- id: stamp_confidential
  name: 대외비/기밀 스탬프
  grade: C
  weight: high
  seed_eligible: true
  terms:
  - 대외비
  - 극비
  - 기밀
  - 사외비
  - CONFIDENTIAL
  - SECRET
  - RESTRICTED

- id: stamp_confidential_phrase
  name: 기밀 취급문구(명시)
  grade: C
  weight: high
  seed_eligible: true
  always: true          # 거의 스탬프 전용 문구 → 위치/반복 무관 1건도 인정
  terms:
  - 관계자 외 열람금지
  - 관계자외 열람금지
  - 관계자 외 열람 금지
  - 대외비-무단복제금지
  - 무단복제금지
  - 무단전재금지
  - 재배포금지
  - NOT FOR DISTRIBUTION
  - DO NOT DISTRIBUTE

- id: stamp_internal
  name: 내부용 스탬프
  grade: S
  weight: high
  seed_eligible: false
  terms:
  - 내부용
  - 사내한정
  - 부외비
  - 취급주의
  - INTERNAL ONLY
  - INTERNAL USE ONLY
  - FOR INTERNAL USE

# ────────────────────────────────────────────────────────────────────────
# Signal C · 경로 택소노미 (파일이 어디서 왔는가 / 어디에 있는가)
#   - 파일 경로(수집원 폴더·파일서버 UNC)를 등급에 매핑한다. 텍스트를 열지 않는다.
#   - match: 경로에 이 조각이 들어 있으면 매칭(부분일치, 대소문자 무시).
#       · 경로 구분자는 코드가 '/' 로 정규화하므로 패턴도 '/' 로 쓴다.
#         (윈도우 역슬래시 \, UNC \\서버\ 는 각각 /서버/, //서버/ 로 표기)
#   - 위에서부터 먼저 매칭되는 규칙 하나만 적용된다(우선순위 = 배열 순서).
#   - acl_restricted: true 면 "강한 제한" 표식 → 다른 신호가 없어도 fail-safe 로 C.
#   ※ ACL·소유자 SID·DRM 태그(윈도우 전용)는 후속 확장 지점. 지금은 경로 기반만.
# ────────────────────────────────────────────────────────────────────────
paths:

- id: secure_server
  name: 기밀 서버·보안파일서버
  match:
  - //hr-server/
  - //secure/
  - 보안파일서버
  - /보안파일서버/
  - /secret/
  grade: C
  acl_restricted: true
  weight: high
  seed_eligible: false

- id: hr_finance_dir
  name: 인사·재무 폴더
  match:
  - /인사/
  - /재무/
  - /hr/
  - /payroll/
  - /finance/
  grade: S
  weight: high
  seed_eligible: false

  acl_restricted: false
- id: public_channel
  name: 회사 공개 채널
  match:
  - /public/
  - /공개/
  - /보도자료/
  - /press/
  - /홈페이지/
  grade: O
  weight: high
  seed_eligible: false

  acl_restricted: false
- id: personal_inbound
  name: 외부 개인 채널(반입 의심)
  match:
  - /download/
  - /다운로드/
  - /webmail/
  - /메신저/
  - /temp/
  grade: O              # 반입 의심 → 보수적으로 S(fail-safe 중간등급)
  weight: medium
  seed_eligible: false    # 유입 경로일 뿐 주제 보증 아님 → seed 제외
  acl_restricted: false
