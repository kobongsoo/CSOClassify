# ============================================================================
# cso_rules.yaml — C/S/O 자동 분류 규칙셋 (L1 정규식 + L2 기밀사전)
# ----------------------------------------------------------------------------
# 등급 우선순위: C(기밀) > S(민감) > O(공개)
#
# [등급 산정 방식]
#   - 각 규칙은 base_grade 를 가진다 (히트 1건이라도 있으면 이 등급).
#   - bulk_threshold 이상 검출되면 bulk_grade 로 "상향"된다.
#       예) 주민번호 1건=S, 5건 이상=C (명단/대장 정황).
#   - 여러 규칙이 걸리면 최종은 max(등급)  → 보수적(높은 등급 우선).
#
# [seed_eligible]
#   - true  : 오탐이 적어, 이 히트로 확정된 문서를 임베딩 전파(Signal B)의
#             "씨앗(seed)"으로 승격해도 안전하다.
#   - false : 오탐 가능성이 있어 등급 참고용으로만 쓰고 seed 로는 쓰지 않는다.
#
# [프라이버시 불변식]
#   - 스캐너는 매칭된 "원문 값"을 절대 저장하지 않는다.
#   - 결과에는 {규칙 id, 종류, 건수}만 남긴다. (예: rrn 12건 검출)
#
# [context_within]
#   - 지정 시, 패턴이 라벨 키워드 근처(N자 이내)에 있을 때만 히트로 인정.
#   - 오탐이 심한 패턴(계좌/여권/면허)의 정밀도를 끌어올린다.
#
# ※ "# TODO(사내)" 로 표시된 항목은 조직 특화라 운영자가 채워야 한다.
# ============================================================================

version: "cso-2026.08.3"

defaults:
  bulk_threshold: 5          # 별도 지정 없으면 5건 이상에서 bulk 상향
  case_insensitive: true     # 영문 키워드 대소문자 무시

# ────────────────────────────────────────────────────────────────────────
# 신뢰도(weight → conf) 표
#   - 각 신호의 weight(high/medium/low)를 0~1 신뢰도로 바꾸는 표.
#   - 신뢰도는 "검토 큐" 편입/정렬에만 쓰인다(신뢰도 < 저신뢰기준이면 사람 검토).
#     C/S/O 등급 자체는 바꾸지 않는다.
#   - 이 값은 UI에서 표기만 하고, 수정은 이 파일을 직접 편집한다.
# ────────────────────────────────────────────────────────────────────────
confidence:
  regex:     {high: 0.90, medium: 0.70, low: 0.50}   # 정규식 PII(형식탐지)
  keyword:   {high: 0.85, medium: 0.70, low: 0.50}   # 기밀사전
  sensitive: {high: 0.85, medium: 0.70, low: 0.55}   # 법상 민감정보군
  stamp:     {high: 0.95, medium: 0.80, low: 0.65}   # 보안분류 스탬프(오탐 낮아 높게)
  path:      {high: 0.90, medium: 0.70, low: 0.50}   # 경로
  name:      0.60                                      # 파일명(힌트라 고정)

# ────────────────────────────────────────────────────────────────────────
# L1 · PII (개인식별정보) — 검출은 ko-pii, 여기선 "유형→등급 정책"만 정의
#   [A안, 2026-08] 자체 정규식+stdnum → ko-pii(Marker-Inc-Korea, MIT) 전면 교체.
#   pattern/validate/context 는 더 이상 안 쓴다(ko-pii 가 체크섬·문맥·회피방어 내장).
#   각 항목은 label(ko-pii 라벨)로 매핑하고, base_grade/bulk_grade/weight/seed 만 정한다.
# ────────────────────────────────────────────────────────────────────────
regex_pii:

- id: rrn
  name: 주민등록번호
  label: RRN
  base_grade: S
  bulk_grade: C
  weight: high
  seed_eligible: true

- id: foreign_reg
  name: 외국인등록번호
  label: FRN
  base_grade: S
  bulk_grade: C
  weight: high
  seed_eligible: true

- id: credit_card
  name: 신용카드번호
  label: CARD
  base_grade: S
  bulk_grade: C
  weight: high
  seed_eligible: true

- id: bank_account
  name: 계좌번호
  label: ACCOUNT       # ko-pii 가 계좌 문맥/형식을 내장 검증(과거 context_within 불필요)
  base_grade: S
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: passport
  name: 여권번호
  label: PASSPORT
  base_grade: S
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: driver_license
  name: 운전면허번호
  label: DRIVER_LICENSE
  base_grade: S
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: phone_mobile
  name: 휴대전화번호
  label: PHONE
  base_grade: O                            # 연락처는 흔함 → 단독으론 공개
  bulk_grade: S                            # 대량이면 명단 정황 → 민감
  weight: low
  seed_eligible: false

- id: email
  name: 이메일주소
  label: EMAIL
  base_grade: O
  bulk_grade: S
  weight: low
  seed_eligible: false

- id: biz_reg_no
  name: 사업자등록번호
  label: BUSINESS_REG   # ko-pii = 국세청 가중합 체크섬(진짜 검증) → stdnum brn 한계 해소
  base_grade: O                            # 반공개 정보
  bulk_grade: S
  weight: low
  seed_eligible: false

- id: corp_reg_no
  name: 법인등록번호
  label: CORP_REG       # ko-pii = 법인 체크섬 검증
  base_grade: O
  bulk_grade: S
  weight: low
  seed_eligible: false

# ── 권장 민감세트(2026-08 추가) — 저오탐·실질 민감 유형 ──────────────
- id: address
  name: 주소
  label: ADDRESS
  base_grade: S
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: medical_insurance
  name: 건강보험번호
  label: MEDICAL_INSURANCE   # 건강정보 = 민감정보(PIPA)
  base_grade: C
  bulk_grade: C
  weight: high
  seed_eligible: false

- id: prescription
  name: 처방전
  label: PRESCRIPTION_ID   # ko-pii 검출기가 내보내는 실제 라벨(과거 'PRESCRIPTION' 오타로 미검출)
  base_grade: C
  bulk_grade: C
  weight: medium
  seed_eligible: false

- id: edi_drug
  name: 의약품(EDI)
  label: EDI_DRUG
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

- id: vehicle
  name: 차량번호
  label: VEHICLE
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

- id: court_case
  name: 사건번호
  label: COURT_CASE
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

- id: pnu
  name: 부동산고유번호
  label: PNU
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

- id: nationality
  name: 국적
  label: NATIONALITY
  base_grade: S
  bulk_grade: C
  weight: low
  seed_eligible: false

# URL·IP: 네트워크 식별자. 단독으론 민감도 낮아 base_grade O(공개), 대량이면 S 로 상향
# (접속로그/네트워크 구성 유출 정황). 운영 중 등급/임계값 조정 가능.
- id: url
  name: URL
  label: URL
  base_grade: O
  bulk_grade: S
  weight: low
  seed_eligible: false

- id: ip_address
  name: IP주소
  label: IP
  base_grade: O
  bulk_grade: S
  weight: low
  seed_eligible: false

# ────────────────────────────────────────────────────────────────────────
# L1-combo · PII 결합식별성 (개인정보보호법/GDPR '결합용이성')
#   - 개별 PII 는 등급이 낮아도(예: 전화·이메일 O), 여러 유형이 '한 문서에' 모이면
#     특정 개인을 재식별하기 쉬워진다 → 상향 등급을 준다.
#   - 판정은 '문서 단위 공존'만 본다(문장 근접성 아님). 위 regex_pii 로 검출된 라벨의
#     건수(>0)를 조합 조건과 대조한다.
#   - 조건 형식(둘 중 하나 또는 둘 다=AND):
#       · all_of: [L1, L2 ...]        → 나열 라벨이 '모두' 있으면 성립
#       · of: [..], min_types: N      → of 그룹에서 '서로 다른' 라벨 N종 이상이면 성립
#   - 최종 등급은 다른 신호·개별 PII 와 max 융합되어 '상향 전용'으로만 작용한다.
#   ※ 결과 근거(terms)에는 결합된 'ko-pii 라벨+건수'만 남는다(원문 PII 값 아님).
# ────────────────────────────────────────────────────────────────────────
pii_combos:

- id: identity_financial
  name: 신원+금융 결합(재식별·금융피해)
  all_of: [RRN, ACCOUNT]        # 주민번호 + 계좌 → 금융 재식별 위험
  grade: C
  weight: high
  seed_eligible: true

- id: identity_card
  name: 신원+카드 결합
  all_of: [RRN, CARD]           # 주민번호 + 신용카드
  grade: C
  weight: high
  seed_eligible: true

- id: identity_address
  name: 신원+주소 결합(거주지 특정)
  all_of: [RRN, ADDRESS]        # 주민번호 + 주소 → 완전한 신원 특정
  grade: C
  weight: high
  seed_eligible: true

- id: foreign_financial
  name: 외국인신원+금융 결합
  all_of: [FRN, ACCOUNT]        # 외국인등록번호 + 계좌
  grade: C
  weight: high
  seed_eligible: true

- id: contact_cluster
  name: 연락처 결합(개인 특정)
  of: [PHONE, EMAIL, ADDRESS]   # 개별론 O 이지만…
  min_types: 2                  # …2종 이상 모이면 개인 특정 가능 → S
  grade: S
  weight: medium
  seed_eligible: false

# ────────────────────────────────────────────────────────────────────────
# L2 · 기밀사전 (키워드/표식)
#   terms 안의 단어가 하나라도 텍스트에 있으면 히트.
# ────────────────────────────────────────────────────────────────────────
keywords:

- id: mark_confidential
  name: 기밀 표식
    # "비밀"(바른 단어)은 비밀번호/영업비밀/비밀유지 등에 과매칭돼 제외.
    #   (영업비밀=tech_secret, 비밀유지=legal_contract 에서 구체형으로 커버)
  terms:
  - 대외비
  - 극비
  - 기밀
  - CONFIDENTIAL
  - RESTRICTED
  - SECRET
  base_grade: C
  weight: high
  seed_eligible: true

- id: mark_internal
  name: 내부용 표식
  terms:
  - 내부용
  - 사내한정
  - 부외비
  - Internal Only
  - Internal Use Only
  - For Internal
  base_grade: S
  weight: high
  seed_eligible: false

- id: hr_payroll
  name: 인사·급여
  terms:
  - 급여대장
  - 임금대장
  - 연봉계약
  - 인사평가
  - 성과평가
  - 인사기록카드
  - 징계
  - 퇴직금
  - 4대보험
  - 원천징수
  base_grade: C
  weight: high
  seed_eligible: false

- id: finance
  name: 재무·회계(내부)
  terms:
  - 재무제표
  - 손익계산서
  - 대차대조표
  - 결산
  - 원가내역
  - 예산안
  - 자금수지
  base_grade: S
  weight: medium
  seed_eligible: false

- id: legal_contract
  name: 법무·계약
  terms:
  - 계약서
  - 합의서
  - 약정서
  - 비밀유지
  - NDA
  - MOU
  - 양해각서
  base_grade: S
  weight: medium
  seed_eligible: false

- id: strategy_ma
  name: 경영전략·M&A
  terms:
  - M&A
  - 인수합병
  - 지분매각
  - 구조조정
  - 사업재편
  - IR자료
  - 투자유치
  base_grade: C
  weight: high
  seed_eligible: false

- id: tech_secret
  name: 기술·영업비밀
  terms:
  - 영업비밀
  - 설계도면
  - 소스코드
  - 알고리즘
  - 미공개특허
  - 제조공정
  - 레시피
  base_grade: C
  weight: medium
  seed_eligible: true

  # ── 조직 특화(운영자 입력 필요) ─────────────────────────────
- id: project_codenames
  name: 프로젝트·제품명
  terms:
  - 엠파워
  - 엠드라이브
  - Mpower
  - MDrive
  base_grade: C
  weight: high
  seed_eligible: false
    # ⚠ 제품 브랜드명이라도 매뉴얼·공지에 '언급'만 돼도 C가 된다. 과분류가
    #    잦으면 base_grade 를 S 로 낮추거나 context_within(예: "대외비","내부")을 고려.

- id: internal_topics
  name: 사내 민감 주제
  terms:
  - 회사규정
  - 인사발령
  - 인사이동
  - 인사기록
  base_grade: S
  weight: medium
  seed_eligible: false        # 구체형으로 좁혀 오탐이 낮음 → seed 로 사용 가능
    # · "재무" → "재무제표" 는 위 finance 그룹(S)에 이미 있어 중복 제외.
    # · "결재" → 흔한 단어라 오탐 커서 제외. 필요하면 "전자결재문서" 등 구체형으로 추가.

# ────────────────────────────────────────────────────────────────────────
# Signal F · 민감정보군 (개인정보보호법 제23조 '민감정보')
#   - 법상 민감정보(건강·유전·성생활·사상/신념·정치·노조·범죄경력·인종)는 별도 취급
#     대상 → 일반 기밀사전(keywords)과 '분리된' 독립 신호로 둔다(정책·감사 명확화).
#   - 각 규칙은 category(범주)를 갖고, 단어가 하나라도 있으면 grade(기본 C) 기여.
#   - 최종 등급은 다른 신호와 max 융합되어 '상향 전용'으로 작용한다.
#   ※ 키워드 기반이라 오탐 가능(예: 일반 기사 속 '정치'). 보수적(상향)으로 두고,
#     과분류는 검토큐에서 사람이 흡수한다. 범주/단어는 결과 근거로 안전하게 남는다.
#   ⚠ terms 는 조직 문서 특성에 맞게 운영자가 가감한다(너무 넓은 단어는 오탐↑).
# ────────────────────────────────────────────────────────────────────────
sensitive:

- id: health
  name: 건강정보
  category: 건강
  grade: C
  weight: high
  seed_eligible: false
  terms:
  - 진단서
  - 진단명
  - 병력
  - 질병명
  - 진료기록
  - 투약내역
  - 처방내역
  - 수술이력
  - 검진결과
  - 장애등급
  - 병명

- id: genetic
  name: 유전정보
  category: 유전
  grade: C
  weight: high
  seed_eligible: false
  terms:
  - 유전자검사
  - 유전정보
  - 유전질환
  - DNA검사

- id: sex_life
  name: 성생활·성적지향
  category: 성생활
  grade: C
  weight: high
  seed_eligible: false
  terms:
  - 성생활
  - 성적지향
  - 성정체성

- id: ideology_politics
  name: 사상·신념·정치
  category: 사상·정치
  grade: C
  weight: high
  seed_eligible: false
  terms:
  - 정치성향
  - 정치적견해
  - 지지정당
  - 정당가입
  - 사상성향
  - 종교

- id: union
  name: 노동조합
  category: 노조
  grade: C
  weight: high
  seed_eligible: false
  terms:
  - 노동조합
  - 노조가입
  - 조합원명부

- id: criminal
  name: 범죄경력
  category: 범죄경력
  grade: C
  weight: high
  seed_eligible: false
  terms:
  - 범죄경력
  - 전과
  - 수사경력
  - 범죄사실
  - 형사처벌
  - 집행유예
  # 제외어: '전과'(前科)가 다른 단어의 부분문자열로 걸리는 오탐 방지.
  #   예) '산전과 산후'(산전+과), '발전과'(발전+과), '충전/운전/도전과' 등.
  #   ⚠ 조직 문서에서 '전과' 오탐이 더 보이면 여기에 그 앞말+전과 형태로 추가.
