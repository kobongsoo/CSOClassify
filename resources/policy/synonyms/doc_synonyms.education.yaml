# ------------------------------------------------------------------
# 업무분류 유의어 사전 — ② 업종 겹(education · 교육)
#  · 얹는 법: doc_rule.yaml 맨 위에 `industry: education` 을 적으면 이 파일이 얹힌다.
#  · 겹 순서: core → 이 파일 → doc_synonyms.local.yaml
#             아래로 갈수록 세다. 학교마다 다른 말은 이 파일이 아니라 local 에 적는다.
#
#  [무엇이 들어 있나]
#    학교·대학·학원·기업교육에서 오가는 문서 이름이다. 크게 넷으로 묶었다.
#      · 수업     — 교수학습지도안·강의계획서·학습지 …
#      · 평가     — 시험지·답안지·채점기준표·성적표 …
#      · 학적·행정 — 학교생활기록부·출석부·재학증명서 …
#      · 학생지도  — 상담일지·가정통신문 …
#    "교육자료"·"교재"·"교안" 은 core 가 이미 잡으므로 여기 없다.
#
#  [주의] '교육'·'평가'·'상담' 은 어느 회사 문서에나 나오는 말이다. 전부
#  filename_only 로 내리고, "교육과정을 이수" 같은 흔한 문장은 excludes 로 막았다.
# ------------------------------------------------------------------
