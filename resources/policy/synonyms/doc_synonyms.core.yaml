# ------------------------------------------------------------------
# 업무분류 유의어 사전 — ① 공통 겹(core)
#  · 쓰는 곳: 설정 ③ 판단 기준 > 업무분류 > "분류 불러오기"
#  · 하는 일: 분류의 가장 아래 이름(예: 요구사항정의서)만 가지고는 못 잡는
#            "같은 뜻 다른 말"(요구사항명세서 · SRS …)을 규칙의 시작값에 얹는다.
#  · 한 겹도 없어도 된다 — 그때는 유의어 없이 띄어쓰기 표기만 만든다(오류가 아니다).
#
#  [사전은 세 겹이고 이 파일은 맨 아래 겹이다]
#    ① doc_synonyms.core.yaml   ← 이 파일. 업종과 무관한 말. 제품이 들고 다닌다
#    ② doc_synonyms.<업종>.yaml   업종 고유 문서 이름(금융·의료·법률 …)
#    ③ doc_synonyms.local.yaml    그 회사에만 있는 말. 관리자가 고치는 자리
#    아래로 갈수록 세다. 어느 업종 사전을 얹을지는 doc_rule.yaml 의 industry 가 정한다.
#    ※ 이름 없는 doc_synonyms.yaml(겹으로 가르기 전의 단일 파일)은 읽지 않는다.
#
#  [이 파일은 고치지 않는다] 제품과 함께 갱신되므로, 여기 적은 것은 다음 배포 때
#  덮어써진다. 회사에서 쓰는 말은 ④ doc_synonyms.local.yaml 에 적는다.
#
#  [순서가 곧 우선순위] 한 분류에 들어가는 말은 10개까지만 쓰인다(파일 이름 칸은 16개).
#  넘치면 뒤에서부터 잘리므로, 확실한 말일수록 앞에 적는다.
#
#  [주의] 너무 넓은 말은 넣지 않는다. "계산서" 같은 말을 세금계산서의 별칭으로
#  넣으면 손익계산서·원가계산서까지 전부 걸린다. 유의어는 좁을수록 좋다.
#  넓은 말을 굳이 넣어야 하면 규칙의 '단, 이 말이 있으면 제외' 칸을 함께 쓴다.
#
#  [사전 안은 다시 두 층이다]
#    · aliases / filename_only / excludes — 분류 이름이 사전에 "그대로" 있을 때만
#      쓰인다. 가장 정확하지만 사전에 없는 이름은 하나도 못 건진다.
#      업종마다 달라지는 것은 사실상 이 층뿐이다.
#    · tails / heads — 이름이 사전에 없어도 꼬리말·머리말만 같으면 걸리는 그물이다.
#      "OO정의서" → "OO명세서" 처럼 한국 회사 문서 이름의 조립 규칙을 쓴다.
#      이 층은 업종을 타지 않는다. 그래서 core 에만 두고 업종 사전은 얇게 간다.
#
#  [꼬리말·머리말은 처음 걸린 것 하나만 쓴다]
#    그래서 긴 말이 짧은 말보다 위에 있어야 한다("결과보고서" 가 "보고서" 보다 위).
#    겹을 합칠 때 코드가 길이순으로 다시 세우므로(_order_longest_first) 파일에서
#    순서가 틀려도 동작은 한다. 그래도 사람이 읽을 때를 위해 지켜서 적는다.
# ------------------------------------------------------------------
# ① 통째 별칭 — 분류 이름이 왼쪽과 같으면 오른쪽 말을 그대로 더한다.
#    ※ 사내 문서에서 실제로 쓰이는 말(규정·지침·제도·안내문 …)을 앞쪽에 두었다.
