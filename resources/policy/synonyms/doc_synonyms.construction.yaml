# ------------------------------------------------------------------
# 업무분류 유의어 사전 — ② 업종 겹(construction · 건설/건축)
#  · 얹는 법: doc_rule.yaml 맨 위에 `industry: construction` 을 적으면 얹힌다.
#             관급공사가 많으면 `industry: [construction, public]` 로 겹쳐 쓴다
#             (과업지시서·입찰공고문 같은 발주 문서는 public 쪽에 있다).
#  · 겹 순서: core → 이 파일 → doc_synonyms.local.yaml
#             아래로 갈수록 세다. 현장마다 다른 말은 이 파일이 아니라 local 에 적는다.
#
#  [무엇이 들어 있나]
#    건설사·감리단·현장에서 오가는 문서 이름이다. 크게 넷으로 묶었다.
#      · 설계·인허가 — 설계도서·시공상세도·구조계산서·착공신고서·사용승인서 …
#      · 시공·공정   — 시공계획서·공정표·공사일보·자재승인원·실정보고서 …
#      · 계약·정산   — 도급계약서·기성청구서·준공정산서·설계변경계약서 …
#      · 안전·환경   — 안전관리계획서·작업허가서·재해발생보고서·TBM일지 …
#    "계약서"·"견적서"·"산출내역서"·"검수확인서"·"위험평가서" 와 꼬리말
#    "시방서"·"사양서"·"성적서"·"일지"·"대장" 은 core 가 이미 잡으므로 여기 없다.
#
#  [주의 — '검사원' 은 사람이기도 하다]
#    건설에서 '준공검사원'·'기성검사원' 은 검사를 신청하는 서류지만, 같은 말이
#    '검사하는 사람' 도 뜻한다("검사원을 배치한다"). 꼬리말로 넣되 excludes 를
#    반드시 함께 둔다. 둘은 한 짝이므로 따로 지우지 않는다.
# ------------------------------------------------------------------
version: 2026.08.1
layer: construction

